name: Code Checker

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Check the card syntax
        run: node --check custom_components/grok_bot/frontend/grok-bot-card.js
