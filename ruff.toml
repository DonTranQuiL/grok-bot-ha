target-version = "py313"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",    # long lines (strings/translations)
    "RUF001",  # ambiguous unicode in user-facing strings
    "RUF012",
]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
