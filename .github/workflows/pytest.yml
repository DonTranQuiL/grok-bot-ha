name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-homeassistant-custom-component playwright
          jq -r '.requirements[]?' custom_components/*/manifest.json | xargs -r pip install
          # Assist (conversation) requirements, pinned to the installed Home Assistant
          python - <<'PY' | xargs -r pip install
          import json, pathlib, homeassistant.components as c
          manifest = pathlib.Path(c.__path__[0]) / "conversation" / "manifest.json"
          print("\n".join(json.loads(manifest.read_text())["requirements"]))
          PY

      - name: Run Pytest
        run: pytest tests/ -v
