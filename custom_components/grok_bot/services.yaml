ask:
  fields:
    message:
      required: true
      example: "The solar tilt looks stuck, check it."
      selector:
        text:
          multiline: true
    action_mode:
      default: report
      selector:
        select:
          translation_key: action_mode
          options:
            - report
            - diagnose
            - fix
    data:
      selector:
        object:
    context_entities:
      selector:
        entity:
          multiple: true
    reply_to:
      example: input_text.grok_bot_answer
      selector:
        text:
    conversation_id:
      selector:
        text:
    notify_user:
      default: false
      selector:
        boolean:
    bypass_budget:
      default: false
      selector:
        boolean:
    config_entry_id:
      selector:
        config_entry:
          integration: grok_bot
